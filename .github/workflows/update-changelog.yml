name: Update Changelog

on:
  release:
    types: [published]

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extract the version tag name (e.g., v1.0.0 -> 1.0.0)
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # Update CHANGELOG.md
      - name: Update Changelog
        uses: vemel/update-changelog@0.0.1
        id: changelog
        with:
          version: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: './CHANGELOG.md'

      # Create a Pull Request with the updated CHANGELOG.md
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update changelog for release ${{ steps.version.outputs.version }}"
          title: "Release ${{ steps.version.outputs.version }} - Update CHANGELOG"
          body: |
            # Release ${{ steps.version.outputs.version }}

            Automated changelog update.

            ## Included Pull Requests
            ${{ steps.changelog.outputs.pulls_list_md }}
          branch: "update-changelog-${{ steps.version.outputs.version }}"
          labels: release, bot
